name: Build Standalone DarkSwordRestore EXE

on:
  push:
    branches:
      - new-darksword-shell
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Publish standalone DarkSwordRestore.exe
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 8.0.x

      - name: Restore standalone project
        shell: pwsh
        run: dotnet restore DarkSwordRestore/src/DarkSwordRestore.App/DarkSwordRestore.App.csproj -r win-x64

      - name: Build standalone project
        shell: pwsh
        run: dotnet build DarkSwordRestore/src/DarkSwordRestore.App/DarkSwordRestore.App.csproj -c Release -r win-x64 --self-contained true --no-restore -warnaserror

      - name: Publish single executable
        shell: pwsh
        run: |
          dotnet publish DarkSwordRestore/src/DarkSwordRestore.App/DarkSwordRestore.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o DarkSwordRestore/build/standalone-exe

          $exe = 'DarkSwordRestore/build/standalone-exe/DarkSwordRestore.exe'
          if (-not (Test-Path $exe -PathType Leaf)) { throw 'DarkSwordRestore.exe was not produced.' }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  DarkSwordRestore.exe" | Set-Content DarkSwordRestore/build/standalone-exe/SHA256SUMS.txt -Encoding ascii

      - name: Upload standalone EXE
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DarkSwordRestore-standalone-exe
          path: |
            DarkSwordRestore/build/standalone-exe/DarkSwordRestore.exe
            DarkSwordRestore/build/standalone-exe/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
