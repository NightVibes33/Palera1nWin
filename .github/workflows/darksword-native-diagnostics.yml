name: DarkSword Native Diagnostics

on:
  push:
    branches: [darksword-restore]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: darksword-native-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose-native:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel git make autoconf automake-wrapper libtool pkgconf python vim
            mingw-w64-x86_64-gcc mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-libusb mingw-w64-x86_64-libzip
            mingw-w64-x86_64-curl mingw-w64-x86_64-zlib
            mingw-w64-x86_64-openssl mingw-w64-x86_64-zstd
            mingw-w64-x86_64-xz mingw-w64-x86_64-bzip2

      - name: Download libirecovery
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ github.token }}
          repo: libimobiledevice/libirecovery
          workflow: build.yml
          name: libirecovery-latest_x86_64-mingw64
          path: DarkSwordRestore/build/deps

      - name: Download libplist
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ github.token }}
          repo: libimobiledevice/libplist
          workflow: build.yml
          name: libplist-latest_x86_64-mingw64
          path: DarkSwordRestore/build/deps

      - name: Download libusbmuxd
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ github.token }}
          repo: libimobiledevice/libusbmuxd
          workflow: build.yml
          name: libusbmuxd-latest_x86_64-mingw64
          path: DarkSwordRestore/build/deps

      - name: Download libimobiledevice-glue
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ github.token }}
          repo: libimobiledevice/libimobiledevice-glue
          workflow: build.yml
          name: libimobiledevice-glue-latest_x86_64-mingw64
          path: DarkSwordRestore/build/deps

      - name: Download libimobiledevice
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ github.token }}
          repo: libimobiledevice/libimobiledevice
          workflow: build.yml
          name: libimobiledevice-latest_x86_64-mingw64
          path: DarkSwordRestore/build/deps

      - name: Download libtatsu
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ github.token }}
          repo: libimobiledevice/libtatsu
          workflow: build.yml
          name: libtatsu-latest_x86_64-mingw64
          path: DarkSwordRestore/build/deps

      - name: Build native stages with captured log
        id: native
        shell: msys2 {0}
        run: |
          set -o pipefail
          ROOT="$GITHUB_WORKSPACE/DarkSwordRestore"
          LOG="$ROOT/build/native-build.log"
          mkdir -p "$ROOT/build"
          {
            set -eux
            BUILD="$ROOT/build/native"
            STAGE="$ROOT/build/native-stage"
            rm -rf "$BUILD" "$STAGE" "$ROOT/build/deps-extract"
            mkdir -p "$BUILD" "$STAGE/resources" "$ROOT/build/deps-extract"

            echo '=== dependency payload ==='
            find "$ROOT/build/deps" -maxdepth 4 -type f -print
            find "$ROOT/build/deps" -type f -name '*.tar' -print0 | while IFS= read -r -d '' archive; do
              tar -C "$ROOT/build/deps-extract" -xf "$archive"
            done
            find "$ROOT/build/deps-extract" -maxdepth 3 -type f | head -100
            cp -rf "$ROOT/build/deps-extract"/* / || true
            pkg-config --list-all | grep -E 'plist|irecovery|imobile|usbmux|tatsu|fragment|libusb|libzip' || true

            echo '=== libfragmentzip ==='
            cd "$BUILD"
            git clone --depth 1 --branch non-libgeneral https://github.com/turdus-m3rula/libfragmentzip.git
            cd libfragmentzip
            ./autogen.sh --prefix=/mingw64
            make -j2
            make install

            echo '=== idevicerestore ==='
            cd "$BUILD"
            git clone --depth 1 --branch sephaxx https://github.com/turdus-m3rula/idevicerestore_fork.git idevicerestore
            cd idevicerestore
            PKG_CONFIG_PATH=/mingw64/lib/pkgconfig ./autogen.sh --prefix=/mingw64 --with-turdusmerula=yes --without-libhfsplus
            make -j2
            cp src/idevicerestore.exe "$STAGE/turdus_merula.exe"

            echo '=== resources ==='
            python "$ROOT/tools/extract_resource_arrays.py" "$BUILD/idevicerestore" "$STAGE/resources"

            echo '=== openra1n ==='
            cd "$BUILD"
            git clone --depth 1 https://github.com/mineek/openra1n.git
            cd openra1n
            make LIBUSB=1
            cp openra1n.exe "$STAGE/openra1n.exe"

            echo '=== darksword-pongo ==='
            gcc -std=c11 -O2 -Wall -Wextra \
              $(pkg-config --cflags libusb-1.0) \
              "$ROOT/native/pongo-bridge/pongo_bridge.c" \
              -o "$STAGE/darksword-pongo.exe" \
              $(pkg-config --libs libusb-1.0)

            echo '=== native output ==='
            find "$STAGE" -maxdepth 2 -type f -printf '%P %s bytes\n' | sort
          } 2>&1 | tee "$LOG"

      - name: Upload native diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: darksword-native-diagnostic-log
          path: DarkSwordRestore/build/native-build.log
          if-no-files-found: error
          retention-days: 7
