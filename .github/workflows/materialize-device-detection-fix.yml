name: Materialize device detection fix

on:
  push:
    branches:
      - fix-normal-device-detection-and-logs

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix-normal-device-detection-and-logs
          fetch-depth: 0
      - name: Apply reviewed device workflow fixes
        run: python3 scripts/materialize-device-detection-fix.py
      - name: Commit corrected sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/Palera1nWin.Core/Models/AppleUsbDevice.cs \
            src/Palera1nWin.Core/Usb/AppleUsbMonitor.cs \
            src/Palera1nWin.Core/Orchestration/JailbreakOrchestrator.cs \
            DarkSwordRestore/src/DarkSwordRestore.Core/AppleDeviceMonitor.cs \
            src/Palera1nWin.App/ViewModels/MainViewModel.cs \
            src/Palera1nWin.App/Views/DowngradeView.xaml.cs \
            src/Palera1nWin.App/Views/DowngradeView.ExactIdentity.cs \
            src/Palera1nWin.App/Views/DowngradeView.SimpleMode.cs
          if git diff --cached --quiet; then
            echo "Sources already materialized."
            exit 0
          fi
          git commit -m "Fix normal device detection and shared hardware logs"
          git push origin HEAD:fix-normal-device-detection-and-logs
