name: Pipeline Recovery Validation

on:
  push:
    branches:
      - fix-downgrade-dashboard-null-crash
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-recovery-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  managed:
    name: Compile app and run every managed test
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - name: Restore, build, test, and publish
        shell: pwsh
        run: |
          dotnet restore src/Palera1nWin.App/Palera1nWin.App.csproj -r win-x64 -p:SelfContained=true
          dotnet restore tests/Palera1nWin.Core.Tests/Palera1nWin.Core.Tests.csproj
          dotnet restore DarkSwordRestore/tests/DarkSwordRestore.Core.Tests/DarkSwordRestore.Core.Tests.csproj
          dotnet build src/Palera1nWin.App/Palera1nWin.App.csproj -c Release -r win-x64 --self-contained true --no-restore -warnaserror
          dotnet test tests/Palera1nWin.Core.Tests/Palera1nWin.Core.Tests.csproj -c Release --no-restore -warnaserror
          dotnet test DarkSwordRestore/tests/DarkSwordRestore.Core.Tests/DarkSwordRestore.Core.Tests.csproj -c Release --no-restore -warnaserror
          dotnet publish src/Palera1nWin.App/Palera1nWin.App.csproj -c Release -r win-x64 --self-contained true --no-restore -p:PublishSingleFile=false -p:TreatWarningsAsErrors=true -o DarkSwordRestore/build/publish
          if (-not (Test-Path DarkSwordRestore/build/publish/Palera1nWin.exe -PathType Leaf)) { throw 'Palera1nWin.exe was not published.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recovery-managed-publish
          path: DarkSwordRestore/build/publish/**
          if-no-files-found: error
          retention-days: 7

  native:
    name: Build pinned Windows native toolchain
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel git autoconf automake-wrapper libtool make pkgconf python vim
            mingw-w64-x86_64-gcc mingw-w64-x86_64-pkgconf mingw-w64-x86_64-libusb
            mingw-w64-x86_64-libzip mingw-w64-x86_64-curl mingw-w64-x86_64-zlib
            mingw-w64-x86_64-openssl mingw-w64-x86_64-readline mingw-w64-x86_64-libplist
            mingw-w64-x86_64-libimobiledevice-glue mingw-w64-x86_64-libusbmuxd
            mingw-w64-x86_64-libimobiledevice mingw-w64-x86_64-libirecovery
            mingw-w64-x86_64-zstd mingw-w64-x86_64-xz mingw-w64-x86_64-bzip2
      - name: Build and verify native runtime
        shell: msys2 {0}
        run: |
          bash DarkSwordRestore/scripts/build-libirecovery-libusb.sh
          bash DarkSwordRestore/scripts/run-native-build.sh
          test -s DarkSwordRestore/build/native-stage/openra1n.exe
          test -s DarkSwordRestore/build/native-stage/openra1n-core.exe
          test -s DarkSwordRestore/build/native-stage/turdus_merula.exe
          test -s DarkSwordRestore/build/native-stage/darksword-pongo.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recovery-native-stage
          path: DarkSwordRestore/build/native-stage/**
          if-no-files-found: error
          retention-days: 7

  package:
    name: Package and smoke-test corrected Windows app
    needs: [managed, native]
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: recovery-managed-publish
          path: DarkSwordRestore/build/publish
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: recovery-native-stage
          path: DarkSwordRestore/build/native-stage
      - name: Package and smoke test
        shell: pwsh
        run: |
          ./DarkSwordRestore/scripts/package-release.ps1 -PublishDirectory 'DarkSwordRestore/build/publish' -NativeDirectory 'DarkSwordRestore/build/native-stage' -OutputDirectory 'DarkSwordRestore/build/release' -Version 'pipeline-recovery'
          ./DarkSwordRestore/scripts/smoke-test-package.ps1 -PackageRoot 'DarkSwordRestore/build/release/DarkSword-Restore-win-x64'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DarkSword-Restore-pipeline-recovery-win-x64
          path: |
            DarkSwordRestore/build/release/*.zip
            DarkSwordRestore/build/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
