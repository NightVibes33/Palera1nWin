name: DarkSword Publish Check

on:
  push:
    branches:
      - darksword-restore
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: darksword-publish-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-check:
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish with diagnostic log
        id: publish
        shell: pwsh
        continue-on-error: true
        run: |
          $log = Join-Path $env:GITHUB_WORKSPACE 'DarkSwordRestore/build/publish-diagnostic.log'
          New-Item -ItemType Directory -Force (Split-Path $log) | Out-Null
          dotnet publish DarkSwordRestore/src/DarkSwordRestore.App/DarkSwordRestore.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o DarkSwordRestore/build/publish-check `
            -v:diag *> $log
          "exit_code=$LASTEXITCODE" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Get-Content $log -Tail 250

      - name: Upload publish diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DarkSword-publish-diagnostic-${{ github.run_number }}
          path: DarkSwordRestore/build/publish-diagnostic.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce publish result
        shell: pwsh
        run: |
          if ('${{ steps.publish.outputs.exit_code }}' -ne '0') {
            throw 'Self-contained publish failed. See the diagnostic artifact.'
          }
