name: Materialize onboarding integrity aliases

on:
  push:
    branches:
      - validate-onboarding-v3

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: validate-onboarding-v3
          fetch-depth: 0
      - run: python3 scripts/materialize-onboarding-integrity-alias.py
      - shell: bash
        run: |
          if git diff --quiet -- src/Palera1nWin.App/App.xaml.cs; then
            echo "Integrity aliases already materialized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Palera1nWin.App/App.xaml.cs
          git commit -m "Alias onboarding package integrity types"
          git push origin HEAD:validate-onboarding-v3
