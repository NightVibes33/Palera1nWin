name: DarkSword Publish Diagnostics

on:
  push:
    branches: [darksword-restore]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: darksword-publish-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-diagnostic:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish and capture output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force DarkSwordRestore/build | Out-Null
          dotnet publish DarkSwordRestore/src/DarkSwordRestore.App/DarkSwordRestore.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o DarkSwordRestore/build/publish `
            2>&1 | Tee-Object -FilePath DarkSwordRestore/build/dotnet-publish.log
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }

      - name: Upload publish output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DarkSword-publish-diagnostic-${{ github.run_number }}
          path: |
            DarkSwordRestore/build/dotnet-publish.log
            DarkSwordRestore/build/publish/**
          if-no-files-found: warn
          retention-days: 7
