name: Materialize physical device fixes

on:
  push:
    branches:
      - fix-physical-device-detection-and-logs

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix-physical-device-detection-and-logs
          fetch-depth: 0
      - run: python3 scripts/materialize-physical-device-fixes.py
      - shell: bash
        run: |
          if git diff --quiet -- src/Palera1nWin.App/Views/DowngradeView.xaml.cs DarkSwordRestore/src/DarkSwordRestore.Core/AppleDeviceMonitor.cs; then
            echo "Physical device fixes were already materialized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Palera1nWin.App/Views/DowngradeView.xaml.cs DarkSwordRestore/src/DarkSwordRestore.Core/AppleDeviceMonitor.cs
          git commit -m "Unify physical device detection and downgrade logging"
          git push origin HEAD:fix-physical-device-detection-and-logs
