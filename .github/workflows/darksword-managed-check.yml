name: DarkSword Managed Check

on:
  push:
    branches:
      - darksword-restore
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: darksword-managed-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  managed-check:
    name: Compile UI and restore core
    runs-on: windows-2022
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10 and .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore src/Palera1nWin.App/Palera1nWin.App.csproj `
            -r win-x64 `
            -p:SelfContained=true
          dotnet restore DarkSwordRestore/tests/DarkSwordRestore.Core.Tests/DarkSwordRestore.Core.Tests.csproj

      - name: Build and test with captured output
        id: managed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force DarkSwordRestore/build | Out-Null
          $log = 'DarkSwordRestore/build/managed-check.log'
          "=== Palera1nWin managed build ===" | Set-Content $log -Encoding UTF8

          dotnet build src/Palera1nWin.App/Palera1nWin.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore *>&1 | Tee-Object -FilePath $log -Append
          $buildExit = $LASTEXITCODE

          "`n=== DarkSword core tests ===" | Add-Content $log -Encoding UTF8
          dotnet test DarkSwordRestore/tests/DarkSwordRestore.Core.Tests/DarkSwordRestore.Core.Tests.csproj `
            -c Release `
            --no-restore *>&1 | Tee-Object -FilePath $log -Append
          $testExit = $LASTEXITCODE

          "`nbuild_exit=$buildExit test_exit=$testExit" | Add-Content $log -Encoding UTF8
          if ($buildExit -ne 0 -or $testExit -ne 0) {
            exit 1
          }

      - name: Upload managed build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DarkSword-managed-check-${{ github.run_number }}
          path: DarkSwordRestore/build/managed-check.log
          if-no-files-found: error
          retention-days: 14
