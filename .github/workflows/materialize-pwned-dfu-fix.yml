name: Materialize pwned DFU fix

on:
  push:
    branches:
      - fix-downgrade-pwned-dfu-stage

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix-downgrade-pwned-dfu-stage
          fetch-depth: 0
      - name: Apply reviewed pwned-DFU source correction
        run: python3 DarkSwordRestore/scripts/materialize-pwned-dfu-restore.py
      - name: Commit corrected source
        shell: bash
        run: |
          if git diff --quiet -- DarkSwordRestore/src/DarkSwordRestore.Core/RestoreServices.cs; then
            echo "RestoreServices.cs was already corrected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DarkSwordRestore/src/DarkSwordRestore.Core/RestoreServices.cs
          git commit -m "Use verified pwned DFU for turdus restore stages"
          git push origin HEAD:fix-downgrade-pwned-dfu-stage
