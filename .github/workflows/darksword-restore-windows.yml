name: DarkSword Restore Windows

on:
  push:
    tags:
      - darksword-v*
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: darksword-restore-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  managed:
    name: Build unified Palera1nWin app
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10 and .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Restore managed dependencies
        shell: pwsh
        run: |
          dotnet restore src/Palera1nWin.App/Palera1nWin.App.csproj `
            -r win-x64 `
            -p:SelfContained=true
          dotnet restore DarkSwordRestore/tests/DarkSwordRestore.Core.Tests/DarkSwordRestore.Core.Tests.csproj

      - name: Build unified app and test restore core
        shell: pwsh
        run: |
          dotnet build src/Palera1nWin.App/Palera1nWin.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore
          dotnet test DarkSwordRestore/tests/DarkSwordRestore.Core.Tests/DarkSwordRestore.Core.Tests.csproj `
            -c Release `
            --no-restore

      - name: Publish self-contained Windows app
        shell: pwsh
        run: |
          dotnet publish src/Palera1nWin.App/Palera1nWin.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=false `
            -o DarkSwordRestore/build/publish
          if (-not (Test-Path DarkSwordRestore/build/publish/Palera1nWin.exe -PathType Leaf)) {
            throw 'Palera1nWin.exe was not published.'
          }

      - name: Upload managed publish
        uses: actions/upload-artifact@v4
        with:
          name: DarkSword-managed-publish
          path: DarkSwordRestore/build/publish/**
          if-no-files-found: error
          retention-days: 7

  native:
    name: Build native downgrade toolchain
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up MSYS2 MinGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            git
            autoconf
            automake-wrapper
            libtool
            make
            pkgconf
            python
            vim
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-libusb
            mingw-w64-x86_64-libzip
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-readline
            mingw-w64-x86_64-libplist
            mingw-w64-x86_64-libimobiledevice-glue
            mingw-w64-x86_64-libusbmuxd
            mingw-w64-x86_64-libimobiledevice
            mingw-w64-x86_64-libirecovery
            mingw-w64-x86_64-zstd
            mingw-w64-x86_64-xz
            mingw-w64-x86_64-bzip2

      - name: Build Windows libirecovery libusbK backend
        shell: msys2 {0}
        run: bash DarkSwordRestore/scripts/build-libirecovery-libusb.sh

      - name: Build native Windows toolchain
        shell: msys2 {0}
        run: bash DarkSwordRestore/scripts/run-native-build.sh

      - name: Verify native stage
        shell: pwsh
        run: |
          $root = 'DarkSwordRestore/build/native-stage'
          $required = @(
            'openra1n.exe',
            'openra1n-core.exe',
            'turdus_merula.exe',
            'darksword-pongo.exe',
            'wdi-simple.exe',
            'libusb-1.0.dll',
            'resources/sep_racer.bin',
            'resources/kpf.bin'
          )
          foreach ($item in $required) {
            $path = Join-Path $root $item
            if (-not (Test-Path $path -PathType Leaf)) { throw "Missing native component: $item" }
            if ((Get-Item $path).Length -eq 0) { throw "Empty native component: $item" }
          }

      - name: Upload native stage
        uses: actions/upload-artifact@v4
        with:
          name: DarkSword-native-stage
          path: DarkSwordRestore/build/native-stage/**
          if-no-files-found: error
          retention-days: 7

      - name: Upload native build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DarkSword-native-build-log-${{ github.run_number }}
          path: |
            DarkSwordRestore/build/native-build.log
            DarkSwordRestore/build/libirecovery-libusb-build.log
            DarkSwordRestore/build/libirecovery-libusb-dependencies.txt
          if-no-files-found: warn
          retention-days: 14

  package:
    name: Package and smoke-test unified app
    needs: [managed, native]
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download managed publish
        uses: actions/download-artifact@v4
        with:
          name: DarkSword-managed-publish
          path: DarkSwordRestore/build/publish

      - name: Download native stage
        uses: actions/download-artifact@v4
        with:
          name: DarkSword-native-stage
          path: DarkSwordRestore/build/native-stage

      - name: Package complete portable release
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            $version = '${{ github.ref_name }}'
          }
          else {
            $version = 'build-${{ github.run_number }}'
          }
          ./DarkSwordRestore/scripts/package-release.ps1 `
            -PublishDirectory 'DarkSwordRestore/build/publish' `
            -NativeDirectory 'DarkSwordRestore/build/native-stage' `
            -OutputDirectory 'DarkSwordRestore/build/release' `
            -Version $version

      - name: Smoke-test packaged executables
        shell: pwsh
        run: |
          ./DarkSwordRestore/scripts/smoke-test-package.ps1 `
            -PackageRoot 'DarkSwordRestore/build/release/DarkSword-Restore-win-x64'

      - name: Upload smoke-test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DarkSword-smoke-test-log-${{ github.run_number }}
          path: DarkSwordRestore/build/release/DarkSword-Restore-win-x64/smoke-logs/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload tested Windows package
        uses: actions/upload-artifact@v4
        with:
          name: DarkSword-Restore-win-x64
          path: |
            DarkSwordRestore/build/release/*.zip
            DarkSwordRestore/build/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/darksword-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            DarkSwordRestore/build/release/*.zip `
            DarkSwordRestore/build/release/SHA256SUMS.txt `
            --title "Palera1nWin DarkSword $env:GITHUB_REF_NAME" `
            --generate-notes