name: DarkSword Restore Windows

on:
  push:
    branches:
      - master
    tags:
      - darksword-v*
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: darksword-restore-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  managed:
    name: Build unified Palera1nWin app
    runs-on: windows-2022
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up .NET 10 and .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Restore managed dependencies
        shell: pwsh
        run: |
          dotnet restore src/Palera1nWin.App/Palera1nWin.App.csproj `
            -r win-x64 `
            -p:SelfContained=true
          dotnet restore tests/Palera1nWin.Core.Tests/Palera1nWin.Core.Tests.csproj
          dotnet restore DarkSwordRestore/tests/DarkSwordRestore.Core.Tests/DarkSwordRestore.Core.Tests.csproj

      - name: Build unified app and run every managed test suite
        shell: pwsh
        run: |
          dotnet build src/Palera1nWin.App/Palera1nWin.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -warnaserror
          dotnet test tests/Palera1nWin.Core.Tests/Palera1nWin.Core.Tests.csproj `
            -c Release `
            --no-restore `
            -warnaserror
          dotnet test DarkSwordRestore/tests/DarkSwordRestore.Core.Tests/DarkSwordRestore.Core.Tests.csproj `
            -c Release `
            --no-restore `
            -warnaserror

      - name: Publish self-contained Windows app
        shell: pwsh
        run: |
          dotnet publish src/Palera1nWin.App/Palera1nWin.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=false `
            -p:TreatWarningsAsErrors=true `
            -o DarkSwordRestore/build/publish
          if (-not (Test-Path DarkSwordRestore/build/publish/Palera1nWin.exe -PathType Leaf)) {
            throw 'Palera1nWin.exe was not published.'
          }

      - name: Upload managed publish
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DarkSword-managed-publish
          path: DarkSwordRestore/build/publish/**
          if-no-files-found: error
          retention-days: 7

  native:
    name: Build pinned native downgrade toolchain
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up MSYS2 MinGW64
        uses: msys2/setup-msys2@4cacabe9519961bff7b6716d46e8b5e568be7700
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            git
            autoconf
            automake-wrapper
            libtool
            make
            pkgconf
            python
            vim
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-libusb
            mingw-w64-x86_64-libzip
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-readline
            mingw-w64-x86_64-libplist
            mingw-w64-x86_64-libimobiledevice-glue
            mingw-w64-x86_64-libusbmuxd
            mingw-w64-x86_64-libimobiledevice
            mingw-w64-x86_64-libirecovery
            mingw-w64-x86_64-zstd
            mingw-w64-x86_64-xz
            mingw-w64-x86_64-bzip2

      - name: Build Windows libirecovery libusbK backend
        shell: msys2 {0}
        run: bash DarkSwordRestore/scripts/build-libirecovery-libusb.sh

      - name: Build native Windows toolchain from pinned commits
        shell: msys2 {0}
        run: bash DarkSwordRestore/scripts/run-native-build.sh

      - name: Verify native stage and source manifest
        shell: pwsh
        run: |
          $root = 'DarkSwordRestore/build/native-stage'
          $required = @(
            'openra1n.exe',
            'openra1n-core.exe',
            'turdus_merula.exe',
            'darksword-pongo.exe',
            'wdi-simple.exe',
            'ideviceinfo.exe',
            'irecovery.exe',
            'libusb-1.0.dll',
            'resources/sep_racer.bin',
            'resources/kpf.bin',
            'native-build-manifest.txt',
            'native-SHA256SUMS.txt'
          )
          foreach ($item in $required) {
            $path = Join-Path $root $item
            if (-not (Test-Path $path -PathType Leaf)) { throw "Missing native component: $item" }
            if ((Get-Item $path).Length -eq 0) { throw "Empty native component: $item" }
          }
          $manifest = Get-Content (Join-Path $root 'native-build-manifest.txt') -Raw
          foreach ($sha in @(
            '60a39f36d719344360ec2e87563ed43f61f0530f',
            '84e47176fee2d856c81f87f2caaa7aca2df679ae',
            'c2ad454aecc3354f3b1a15dcb4d4b4dc0e83b743',
            '4595a5333e4134ade77b43fb2259e880b85801ee'
          )) {
            if (-not $manifest.Contains($sha)) { throw "Pinned source SHA missing from native manifest: $sha" }
          }

      - name: Upload native stage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DarkSword-native-stage
          path: DarkSwordRestore/build/native-stage/**
          if-no-files-found: error
          retention-days: 7

      - name: Upload native build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DarkSword-native-build-log-${{ github.run_number }}
          path: |
            DarkSwordRestore/build/native-build.log
            DarkSwordRestore/build/libirecovery-libusb-build.log
            DarkSwordRestore/build/libirecovery-libusb-dependencies.txt
          if-no-files-found: warn
          retention-days: 14

  package:
    name: Sign, package, and smoke-test unified app
    needs: [managed, native]
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download managed publish
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: DarkSword-managed-publish
          path: DarkSwordRestore/build/publish

      - name: Download native stage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: DarkSword-native-stage
          path: DarkSwordRestore/build/native-stage

      - name: Require signing credentials for tagged releases
        if: startsWith(github.ref, 'refs/tags/darksword-v')
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.DARKSWORD_WINDOWS_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.DARKSWORD_WINDOWS_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:SIGNING_PFX_PASSWORD)) {
            throw 'Tagged releases require DARKSWORD_WINDOWS_PFX_BASE64 and DARKSWORD_WINDOWS_PFX_PASSWORD secrets.'
          }

      - name: Authenticode-sign release executables
        if: startsWith(github.ref, 'refs/tags/darksword-v')
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.DARKSWORD_WINDOWS_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.DARKSWORD_WINDOWS_PFX_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'darksword-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $signtool) { throw 'signtool.exe was not found.' }
          $files = Get-ChildItem DarkSwordRestore/build/publish,DarkSwordRestore/build/native-stage -Recurse -File |
            Where-Object { $_.Extension -in '.exe','.dll' }
          foreach ($file in $files) {
            & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com `
              /f $pfx /p $env:SIGNING_PFX_PASSWORD $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signing failed: $($file.FullName)" }
            & $signtool.FullName verify /pa /all $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signature verification failed: $($file.FullName)" }
          }
          Remove-Item $pfx -Force

      - name: Package complete portable release
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            $version = '${{ github.ref_name }}'
          }
          else {
            $version = 'build-${{ github.run_number }}'
          }
          ./DarkSwordRestore/scripts/package-release.ps1 `
            -PublishDirectory 'DarkSwordRestore/build/publish' `
            -NativeDirectory 'DarkSwordRestore/build/native-stage' `
            -OutputDirectory 'DarkSwordRestore/build/release' `
            -Version $version

      - name: Smoke-test complete packaged runtime
        shell: pwsh
        run: |
          ./DarkSwordRestore/scripts/smoke-test-package.ps1 `
            -PackageRoot 'DarkSwordRestore/build/release/DarkSword-Restore-win-x64'

      - name: Upload smoke-test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DarkSword-smoke-test-log-${{ github.run_number }}
          path: DarkSwordRestore/build/release/DarkSword-Restore-win-x64/smoke-logs/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload tested Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DarkSword-Restore-win-x64
          path: |
            DarkSwordRestore/build/release/*.zip
            DarkSwordRestore/build/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish signed tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/darksword-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            DarkSwordRestore/build/release/*.zip `
            DarkSwordRestore/build/release/SHA256SUMS.txt `
            --title "Palera1nWin DarkSword $env:GITHUB_REF_NAME" `
            --generate-notes
