name: DarkSword Restore Windows

on:
  push:
    branches:
      - darksword-restore
    tags:
      - darksword-v*
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: darksword-restore-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore managed dependencies
        shell: pwsh
        run: |
          dotnet restore DarkSwordRestore/src/DarkSwordRestore.App/DarkSwordRestore.App.csproj --runtime win-x64
          dotnet restore DarkSwordRestore/tests/DarkSwordRestore.Core.Tests/DarkSwordRestore.Core.Tests.csproj

      - name: Build managed projects
        shell: pwsh
        run: |
          dotnet build DarkSwordRestore/src/DarkSwordRestore.App/DarkSwordRestore.App.csproj -c Release --no-restore
          dotnet build DarkSwordRestore/tests/DarkSwordRestore.Core.Tests/DarkSwordRestore.Core.Tests.csproj -c Release --no-restore

      - name: Run managed tests
        shell: pwsh
        run: dotnet test DarkSwordRestore/tests/DarkSwordRestore.Core.Tests/DarkSwordRestore.Core.Tests.csproj -c Release --no-build

      - name: Set up MSYS2 MinGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            git
            autoconf
            automake-wrapper
            libtool
            make
            pkgconf
            python
            vim
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-libusb
            mingw-w64-x86_64-libzip
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-readline
            mingw-w64-x86_64-libplist
            mingw-w64-x86_64-libimobiledevice-glue
            mingw-w64-x86_64-libusbmuxd
            mingw-w64-x86_64-libimobiledevice
            mingw-w64-x86_64-libirecovery
            mingw-w64-x86_64-zstd
            mingw-w64-x86_64-xz
            mingw-w64-x86_64-bzip2

      - name: Build Windows libirecovery libusbK backend
        shell: msys2 {0}
        run: bash DarkSwordRestore/scripts/build-libirecovery-libusb.sh

      - name: Build native Windows toolchain
        shell: msys2 {0}
        run: bash DarkSwordRestore/scripts/run-native-build.sh

      - name: Upload native build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DarkSword-native-build-log-${{ github.run_number }}
          path: |
            DarkSwordRestore/build/native-build.log
            DarkSwordRestore/build/libirecovery-libusb-build.log
            DarkSwordRestore/build/libirecovery-libusb-dependencies.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Publish self-contained Windows app
        shell: pwsh
        run: |
          dotnet publish DarkSwordRestore/src/DarkSwordRestore.App/DarkSwordRestore.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o DarkSwordRestore/build/publish

      - name: Package complete portable release
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}"
          }
          else {
            $version = "build-${{ github.run_number }}"
          }
          ./DarkSwordRestore/scripts/package-release.ps1 `
            -PublishDirectory "DarkSwordRestore/build/publish" `
            -NativeDirectory "DarkSwordRestore/build/native-stage" `
            -OutputDirectory "DarkSwordRestore/build/release" `
            -Version $version

      - name: Smoke-test packaged executables
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'DarkSwordRestore/build/release/DarkSword-Restore-win-x64/toolchain'
          $help = & (Join-Path $root 'turdus_merula.exe') --help 2>&1 | Out-String
          if ($help -notmatch 'get-shcblock' -or $help -notmatch 'get-pteblock') {
            throw 'turdus_merula.exe is missing the required turdus operations.'
          }
          & (Join-Path $root 'darksword-pongo.exe') 2>$null
          if ($LASTEXITCODE -ne 1) {
            throw "Unexpected darksword-pongo usage exit code: $LASTEXITCODE"
          }
          $irecovery = Get-ChildItem $root -Filter 'libirecovery-1.0*.dll' | Select-Object -First 1
          if (-not $irecovery) {
            throw 'The packaged libusb-backed libirecovery DLL is missing.'
          }

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: DarkSword-Restore-win-x64
          path: |
            DarkSwordRestore/build/release/*.zip
            DarkSwordRestore/build/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/darksword-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            DarkSwordRestore/build/release/*.zip `
            DarkSwordRestore/build/release/SHA256SUMS.txt `
            --title "DarkSword Restore $env:GITHUB_REF_NAME" `
            --generate-notes
