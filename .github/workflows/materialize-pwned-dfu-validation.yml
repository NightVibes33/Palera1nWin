name: Materialize pwned DFU validation

on:
  push:
    branches:
      - fix-downgrade-pwned-dfu-stage

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix-downgrade-pwned-dfu-stage
          fetch-depth: 0
      - name: Apply reviewed package checks and documentation
        run: python3 DarkSwordRestore/scripts/materialize-pwned-dfu-validation.py
      - name: Commit corrected validation and documentation
        shell: bash
        run: |
          if git diff --quiet -- DarkSwordRestore/scripts/smoke-test-package.ps1 README.md; then
            echo "Validation and documentation were already corrected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DarkSwordRestore/scripts/smoke-test-package.ps1 README.md
          git commit -m "Validate and document pwned DFU restore stages"
          git push origin HEAD:fix-downgrade-pwned-dfu-stage
